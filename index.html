    const bar=t.start&&t.end?`<div class="task-bar" role="button" tabindex="0" aria-label="${SNAPSHOT?'View':'Edit'} ${esc(identity(t))}${done?' · Done':''}" data-task="${esc(t.id)}" style="${position(t.start,t.end)};--bar-color:${COLORS[cat]||COLORS.Other};--bar-fill:${TASK_COLORS[cat]||TASK_COLORS.Other}" title="${esc(identity(t))}\n${esc(t.status)}\n${niceDate(t.start)} – ${niceDate(t.end)}\n${esc(patch?.name||'No patch')}\n${esc(t.assignees.join(', '))}">${SNAPSHOT?'':'<span class="resize-handle left" data-edge="start"></span>'}${done?'<span class="bar-done" aria-hidden="true">✓</span>':''}<span class="bar-title">${esc(subject(t.title))}</span><span class="bar-patch">${esc(patch?.name||'No patch')}</span>${SNAPSHOT?'':'<span class="resize-handle right" data-edge="end"></span>'}</div>`:`<span class="draw-hint">${done?'Completed · No dates recorded':SNAPSHOT?'No dates scheduled':'Choose dates in the task editor'}</span>`;
    return `<div class="time-row task-row ${done?'is-done ':''}${selected===t.id?'selected':''}" data-row="${esc(t.id)}"><div class="row-label" data-edit="${esc(t.id)}">${label}</div>${track(bar)}</div>`;
  };
  for(const cat of cats){const items=active.filter(t=>category(t.title)===cat);if(!items.length)continue;html+=row('category-row',`${esc(cat.toUpperCase())} <span style="opacity:.5">${items.length}</span>`,'')+items.map(taskRow).join('');}
  if(!tasks.length)html+='<div class="empty-note">No tasks match these filters.</div>';
  if(!SNAPSHOT)html+=row('new-row','＋ Draw a new task','<span class="draw-hint">Click and drag across dates to schedule a task</span>');
  if(completed.length){

  const completedToggle=$('#toggle-completed');if(completedToggle)completedToggle.onclick=()=>{ui.completedOpen=!ui.completedOpen;renderTimeline();$('#toggle-completed')?.focus({preventScroll:true});};

  scroll.querySelectorAll('.task-bar').forEach(bar=>{bar.addEventListener('pointerdown',dragTask);bar.addEventListener('keydown',keyboardTask);});scroll.querySelector('.new-row .row-track').addEventListener('pointerdown',drawTask);scroll.querySelector('.new-row .row-label').onclick=()=>newTask();
}
function jump(date){$('#timeline').scrollLeft=Math.max(0,daysBetween(state.range.start,date)*width);$('#month').value=date.slice(0,7)+'-01';}
function newTask(start=today(state.timeZone),end=start){openEditor({title:'[Design] ',start,end,assignees:[],priority:'',comment:'',status:'Backlog',issueNumber:null});}
function openEditor(task){
  if(SNAPSHOT){showDetails(task);return;}
  if(busy||saving)return;selected=task.id||'new';renderTimeline();const editor=$('#editor'),cat=category(task.title),name=subject(task.title);editor.hidden=false;
  editor.innerHTML=`<div class="editor-top"><strong>${task.id?'Edit task':'New task'} ${task.issueNumber?'#'+task.issueNumber:''}</strong><button id="close-editor" class="icon-button" aria-label="Close task editor">×</button></div><form id="task-form"><label for="task-status">Status</label><div class="status-pair"><select id="task-status">${[...new Set([...(state.statuses||STATUSES),task.status])].map(s=>`<option ${s===task.status?'selected':''}>${esc(s)}</option>`).join('')}</select>${task.status==='Done'?'':'<button type="button" id="mark-done">✓ Mark done</button>'}</div><label for="task-category">Category</label><select id="task-category">${[...new Set([...CATEGORIES,cat])].map(c=>`<option ${c===cat?'selected':''}>${esc(c)}</option>`).join('')}</select><label for="task-title">Task name</label><input id="task-title" required maxlength="180" value="${esc(name)}" placeholder="What needs to be done?"><div class="form-pair"><div><label for="task-start">Start date</label><input id="task-start" type="date" value="${esc(task.start)}"></div><div><label for="task-end">End date</label><input id="task-end" type="date" value="${esc(task.end)}"></div></div><label>Patch</label><div class="patch-value"><strong id="task-patch"></strong><span>AUTO</span></div><div class="helper">Determined by the end date.</div><label for="task-priority">Priority</label><select id="task-priority">${[['','Not set'],['P0','P0 — Urgent'],['P1','P1 — High'],['P2','P2 — Normal']].map(([v,n])=>`<option value="${v}" ${v===task.priority?'selected':''}>${n}</option>`).join('')}</select><label>Assigned to</label><div class="owner-list">${[...new Set([...state.people,...task.assignees])].map(p=>`<label><input type="checkbox" name="owner" value="${esc(p)}" ${task.assignees.includes(p)?'checked':''}>${esc(p)}</label>`).join('')}</div><label for="extra-owner">Add a GitHub username</label><input id="extra-owner" placeholder="Optional, e.g. teammate" pattern="[A-Za-z0-9-]{1,39}"><label for="task-comment">Comment <span style="opacity:.65">(optional)</span></label><textarea id="task-comment" maxlength="10000" placeholder="Context, a question, or a document link…">${esc(task.comment)}</textarea><div class="helper">Saved locally. Sync Timeline adds a cell note; Update board adds a Planning comment section to the issue and sets its board status. Done closes the issue.</div><div id="editor-error" class="error" role="alert"></div><div class="form-footer"><button type="submit" class="primary">Save task</button><button type="button" id="cancel-editor">Cancel</button></div>${task.issueNumber?`<div class="helper"><a target="_blank" rel="noopener" href="https://github.com/${esc(state.project.repository)}/issues/${task.issueNumber}">Open issue #${task.issueNumber} ↗</a></div>`:''}</form>`;
  const close=()=>{editor.hidden=true;selected=null;renderTimeline();};$('#close-editor').onclick=close;$('#cancel-editor').onclick=close;
  const updatePatch=()=>$('#task-patch').textContent=patchFor($('#task-end').value,state.releases)?.name||'Outside release dates';$('#task-end').oninput=updatePatch;updatePatch();
  $('#task-form').onsubmit=async event=>{event.preventDefault();const title=$('#task-category').value===cat&&$('#task-title').value===name?task.title:titleFor($('#task-category').value,$('#task-title').value);const assignees=[...editor.querySelectorAll('[name=owner]:checked')].map(i=>i.value),extra=$('#extra-owner').value.trim();if(extra&&!assignees.includes(extra))assignees.push(extra);const draft={...task,title,status:$('#task-status').value,start:$('#task-start').value||null,end:$('#task-end').value||null,assignees,priority:$('#task-priority').value,comment:$('#task-comment').value};try{validateTask(draft);await saveTask(draft);close();toast(`Saved ${identity(draft)} locally.`);}catch(e){$('#editor-error').textContent=e.message;}};
  const markDone=$('#mark-done');if(markDone)markDone.onclick=()=>{$('#task-status').value='Done';$('#task-form').requestSubmit();};
  if(!task.id)$('#task-title').focus();
}
function showDetails(task){
  selected=task.id;renderTimeline();const editor=$('#editor'),patch=patchFor(task.end,state.releases),field=(label,value)=>`<label>${label}</label><div class="detail-value">${value}</div>`;editor.hidden=false;
  editor.innerHTML=`<div class="editor-top"><strong>${task.issueNumber?'Task #'+task.issueNumber:'Draft task'}</strong><button id="close-editor" class="icon-button" aria-label="Close task details">×</button></div><span class="pill">${esc(task.status)}</span>${field('Category',esc(category(task.title)))}${field('Task name',esc(subject(task.title)))}${field('Dates',task.start?`${niceDate(task.start)} – ${niceDate(task.end)} · ${countdown(task.end,today(state.timeZone))}`:'Not scheduled')}${field('Patch',esc(patch?.name||'Outside release dates'))}${field('Priority',esc(task.priority||'Not set'))}${field('Assigned to',task.assignees.length?task.assignees.map(esc).join(', '):'Unassigned')}${task.comment?field('Comment',`<span class="detail-comment">${esc(task.comment)}</span>`):''}${task.issueNumber?`<div class="helper"><a target="_blank" rel="noopener" href="https://github.com/${esc(state.project.repository)}/issues/${task.issueNumber}">Open issue #${task.issueNumber} ↗</a></div>`:''}`;
  $('#close-editor').onclick=()=>{editor.hidden=true;selected=null;renderTimeline();};

async function saveTask(task){if(saving||busy)throw new Error('Wait for the current action to finish.');saving=true;buttonBusy();try{const result=await api('/api/tasks',{...task,revision:state.revision});state=result.state;render();return result.task;}finally{saving=false;buttonBusy();}}
function dragTask(event){
  if(event.button!==0||busy||saving)return;event.preventDefault();const bar=event.currentTarget,task=state.tasks.find(t=>t.id===bar.dataset.task),edge=event.target.dataset.edge,initialX=event.clientX,start=task.start,end=task.end;let moved=false,next={start,end};bar.setPointerCapture(event.pointerId);
  const move=e=>{const delta=Math.round((e.clientX-initialX)/width);moved=moved||Math.abs(e.clientX-initialX)>4;let a=start,b=end;if(edge==='start')a=addDays(start,Math.max(daysBetween(start,state.range.start),Math.min(delta,daysBetween(start,end))));else if(edge==='end')b=addDays(end,Math.min(daysBetween(end,state.range.end),Math.max(delta,daysBetween(end,start))));else{const shift=Math.max(daysBetween(start,state.range.start),Math.min(delta,daysBetween(end,state.range.end)));a=addDays(start,shift);b=addDays(end,shift);}next={start:a,end:b};bar.style.left=daysBetween(state.range.start,a)*width+'px';bar.style.width=(daysBetween(a,b)+1)*width+'px';bar.classList.add('dragging');bar.querySelector('.bar-title').textContent=`${niceDate(a)} – ${niceDate(b)}`;bar.querySelector('.bar-patch').textContent=patchFor(b,state.releases)?.name||'No patch';};
  const finish=async e=>{bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',finish);bar.removeEventListener('pointercancel',cancel);if(bar.hasPointerCapture(e.pointerId))bar.releasePointerCapture(e.pointerId);if(!moved){openEditor(task);return;}if(next.start===start&&next.end===end){renderTimeline();return;}try{await saveTask({...task,...next});toast(`${identity(task)} · ${niceDate(next.start)} – ${niceDate(next.end)}`,()=>saveTask({...state.tasks.find(t=>t.id===task.id),start,end}));if(selected===task.id)openEditor(state.tasks.find(t=>t.id===task.id));}catch(error){toast(error.message);renderTimeline();}};
  const cancel=()=>{bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',finish);bar.removeEventListener('pointercancel',cancel);renderTimeline();};bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',finish);bar.addEventListener('pointercancel',cancel);
}
async function keyboardTask(event){const task=state.tasks.find(t=>t.id===event.currentTarget.dataset.task);if(event.key==='Enter'||event.key===' '){event.preventDefault();openEditor(task);return;}if(!['ArrowLeft','ArrowRight'].includes(event.key)||busy||saving)return;event.preventDefault();const delta=event.key==='ArrowRight'?1:-1,draft={...task,start:event.shiftKey?task.start:addDays(task.start,delta),end:addDays(task.end,delta)};if(draft.start<state.range.start||draft.end>state.range.end||draft.end<draft.start)return;try{await saveTask(draft);$('#timeline').querySelector(`[data-task="${CSS.escape(task.id)}"]`)?.focus();toast(`Saved ${identity(task)} · ${niceDate(draft.start)} – ${niceDate(draft.end)}`);}catch(e){toast(e.message);}}
function drawTask(event){if(event.button!==0||busy||saving)return;event.preventDefault();const track=event.currentTarget,rect=track.getBoundingClientRect(),max=daysBetween(state.range.start,state.range.end),index=x=>Math.min(max,Math.max(0,Math.floor((x-rect.left)/width))),first=index(event.clientX);let last=first;const preview=document.createElement('div');preview.className='draw-range';track.append(preview);track.setPointerCapture(event.pointerId);const paint=()=>{preview.style.left=Math.min(first,last)*width+'px';preview.style.width=(Math.abs(last-first)+1)*width+'px';};paint();const move=e=>{last=index(e.clientX);paint();};const cleanup=()=>{track.removeEventListener('pointermove',move);track.removeEventListener('pointerup',finish);track.removeEventListener('pointercancel',cleanup);preview.remove();};const finish=e=>{cleanup();if(track.hasPointerCapture(e.pointerId))track.releasePointerCapture(e.pointerId);newTask(addDays(state.range.start,Math.min(first,last)),addDays(state.range.start,Math.max(first,last)));};track.addEventListener('pointermove',move);track.addEventListener('pointerup',finish);track.addEventListener('pointercancel',cleanup);}
async function runAction(action){try{if((['timeline','board','design'].includes(action)&&!connections.google)||(['board','design'].includes(action)&&!connections.github)||(action==='refresh'&&!connections.github&&!connections.google)){showConnections();return;}const result=await api('/api/jobs',{action});busy=result.job.id;buttonBusy();toast(`${({timeline:'Sync Timeline',board:'Update board',design:'Update Design links',refresh:'Refresh sources'})[action]} is running…`);schedulePoll();}catch(e){toast(e.message);}}
function showConnections(){
  const status=p=>connections[p]?'<span class="status-on">Connected</span>':'<span class="status-off">Not connected</span>';
  modal('Connections',`<p>Your plan works locally. Connect these accounts once to read and update the online sources.</p><div class="connection-card"><h3>GitHub ${status('github')}</h3><p>Use an account with access to <strong>mustikkakissa/Murder-Crow</strong> and Project Board #2.</p>${connections.github?'<button data-disconnect="github">Disconnect GitHub</button>':'<label for="github-token">Personal access token</label><input id="github-token" type="password" autocomplete="off" placeholder="Paste token here"><label class="remember"><input id="remember-github" type="checkbox">Remember on this Windows account</label><button class="primary" id="connection-github">Connect GitHub</button>'}<details><summary>How to connect</summary><p>Create a <a href="https://github.com/settings/tokens/new?scopes=repo,project&description=Murder%20Crow%20Dashboard" target="_blank" rel="noopener">GitHub personal access token (classic)</a> with <code>repo</code> and <code>project</code> scopes. The account must already have permission to edit this repository and board. An organization may require token approval or SSO authorization.</p></details></div><div class="connection-card"><h3>Google Sheets ${status('google')}</h3><p>Connect the Google account that can edit the Murder Crow spreadsheet.</p>${connections.google?'<button data-disconnect="google">Disconnect Google Sheets</button>':'<label for="google-config">Desktop OAuth client JSON</label><input id="google-config" type="file" accept=".json,application/json"><label class="remember"><input id="remember-google" type="checkbox">Remember on this Windows account</label><button class="primary" id="connection-google">Continue with Google</button>'}<details><summary>One-time Google setup</summary><ol><li>In <a href="https://console.cloud.google.com/apis/library/sheets.googleapis.com" target="_blank" rel="noopener">Google Cloud</a>, create or select a project and enable Google Sheets API.</li><li>Configure the Google Auth consent screen. If the app is in Testing, add your Google account as a test user.</li><li>Create an OAuth client with application type <strong>Desktop app</strong>, then download its JSON file.</li><li>Choose that file above and continue to Google to grant access.</li></ol><p>Testing-mode access can expire after seven days. If it does, reconnect here. The JSON stays on this computer.</p></details></div><p class="helper">Remembered connections are encrypted for your Windows account. Otherwise they last until this dashboard server closes. Disconnect removes the local connection.</p><div id="connection-error" class="error" role="alert"></div>`);
  $('#connection-github')?.addEventListener('click',async event=>{const button=event.currentTarget;button.disabled=true;$('#connection-error').textContent='';try{const token=$('#github-token').value.trim(),remember=$('#remember-github').checked;$('#github-token').value='';const result=await api('/api/connections/github',{token,remember});await load();showConnections();toast(`GitHub connected as ${result.login}.`);}catch(e){$('#connection-error').textContent=e.message;button.disabled=false;}});
  $('#connection-google')?.addEventListener('click',async event=>{const button=event.currentTarget;button.disabled=true;$('#connection-error').textContent='';try{const file=$('#google-config').files[0];if(!file)throw new Error('Choose your Desktop OAuth client JSON file first.');const config=JSON.parse(await file.text()),result=await api('/api/connections/google',{config,remember:$('#remember-google').checked});location.assign(result.url);}catch(e){$('#connection-error').textContent=e.message;button.disabled=false;}});
  document.querySelectorAll('[data-disconnect]').forEach(button=>button.onclick=async()=>{try{button.disabled=true;await api('/api/connections/disconnect',{provider:button.dataset.disconnect});await load();showConnections();}catch(e){$('#connection-error').textContent=e.message;button.disabled=false;}});
}
if(!SNAPSHOT){$('#connections').onclick=showConnections;$('#new-task').onclick=()=>newTask();$('#refresh').onclick=()=>runAction('refresh');document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>runAction(b.dataset.action));}
$('#search').oninput=e=>{ui.search=e.target.value;if(ui.search.trim())ui.completedOpen=true;renderTimeline();};$('#owner-filter').onchange=e=>{ui.owner=e.target.value;renderTimeline();};$('#status-filter').onchange=e=>{ui.status=e.target.value;if(ui.status==='Done')ui.completedOpen=true;renderTimeline();};$('#today').onclick=()=>jump(addDays(today(state.timeZone),-3));$('#month').onchange=e=>jump(e.target.value);$('#zoom').onchange=e=>{const offset=$('#timeline').scrollLeft/width;width=Number(e.target.value);renderTimeline();$('#timeline').scrollLeft=offset*width;};
if(!SNAPSHOT)$('#discord').onclick=async()=>{try{const result=await api('/api/discord');modal('Discord update',`<p>Includes all unfinished tasks and their timing, plus milestone deadlines and course sessions in the next calendar month, and upcoming scheduled discussions.</p><p class="helper">Board snapshot: ${esc(stamp(result.boardUpdatedAt))}.${result.localChanges?' Local planning edits are included.':''} Refresh sources for the latest board status.</p><textarea class="output" id="discord-output" aria-label="Discord message">${esc(result.text)}</textarea><div class="modal-actions"><span id="copy-result" class="helper"></span><button id="copy-discord" class="primary">Copy message</button></div>`);$('#copy-discord').onclick=async()=>{try{await navigator.clipboard.writeText($('#discord-output').value);$('#copy-result').textContent='Copied. Ready to paste into Discord.';}catch{$('#discord-output').select();$('#copy-result').textContent='Press Ctrl+C to copy the selected message.';}};}catch(e){toast(e.message);}};
